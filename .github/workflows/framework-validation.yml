name: Framework validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  framework-validation:
    name: framework-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Dependencies
        run: python -m pip install -r research/requirements.txt ruff==0.16.8
      - name: Static checks
        run: |
          python -m ruff check ml --select E9,F63,F7,F82
          python -m ruff format --check ml/forecast_integrity.py ml/evidence_status.py ml/tests/test_forecast_integrity.py
      - name: Request schema and end-to-end custody fixtures
        run: python -B -m pytest ml/tests/test_forecast_integrity.py ml/tests/test_one_chat.py ml/tests/test_release_records.py -q -p no:cacheprovider
      - name: Full regression suite
        run: python -B -m pytest ml/tests -q -p no:cacheprovider

  windows-portability:
    # Owner order 17 November 2026 (CR-2026.11.17-R1): the owner works on Windows; the Linux job cannot catch
    # POSIX-only code such as fcntl. Runs the lock, custody and historical-evidence tests on Windows.
    name: windows-portability
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Portability, custody and historical-evidence tests on Windows
        run: python -B -m pytest ml/tests/test_v28_fixes.py ml/tests/test_timing_enforcement.py ml/tests/test_historical_pre_event.py ml/tests/test_one_chat.py ml/tests/test_forecast_integrity.py ml/tests/test_drop_seal.py ml/tests/test_v29_parallel.py -q -p no:cacheprovider
