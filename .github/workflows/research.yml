name: Sports research checks
on:
  push:
    paths:
      - 'research/**'
      - 'runtime/**'
      - 'prediction logs/**'
      - '*.md'
      - '.github/workflows/research.yml'
      - 'Previous Sports Results/_football_research/**'
  pull_request:
    paths:
      - 'research/**'
      - 'runtime/**'
      - 'prediction logs/**'
      - '*.md'
      - '.github/workflows/research.yml'
      - 'Previous Sports Results/_football_research/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Custody checks compare retained original Git blobs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: research/requirements.lock.txt
      - run: python -m pip install -r research/requirements.lock.txt
      - run: python -m pip install -r research/requirements-lint.txt
      - name: Static checks (undefined names, unused code, types)
        run: |
          python -m ruff check runtime research/operations
          python -m ruff check --select F821,F822,F823,F811,F63,F7,F82 research/src
          python -m mypy --config-file mypy.ini runtime/src research/src research/operations
      - name: Research and operations regressions
        run: python -B -m pytest -p no:cacheprovider research/tests research/operations research/experiments runtime/tests -q
      - name: Canonical source and projection custody
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.log_card verify
      - name: Full custody including local benchmark bodies
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.verify_custody
      - name: Reconciliation archives and current documents
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.verify_reconciliation
      - name: Selected control freeze
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.control_freeze --verify
      - name: All-log documentary and settlement readback
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.verify_all_logs
      - name: All fifteen experiment measurement protocols
        if: ${{ !cancelled() }}
        run: python -B -m research.experiments.runner verify
      - name: Imported mini and combined-log rollover custody
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.verify_rollover
      - name: Supplied carryover retrospective exhibit custody
        if: ${{ !cancelled() }}
        run: python -B -m research.operations.verify_carryover_review
