# ENG-02: static type checks in CI. runtime/src, research/operations and the newer research/src modules must stay clean.
# The modules listed under "baseline debt" predate the check; their errors are tolerated until each is cleaned,
# and a module is removed from the list the moment it passes. New modules never go on the list.
[mypy]
python_version = 3.14
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR

[mypy-research.src.archive]
ignore_errors = True
[mypy-research.src.archive_sources]
ignore_errors = True
[mypy-research.src.ledger]
ignore_errors = True
[mypy-research.src.settle]
ignore_errors = True
[mypy-research.src.sources]
ignore_errors = True
[mypy-research.src.load]
ignore_errors = True
[mypy-research.src.emit_card]
ignore_errors = True
[mypy-research.src.pilot]
ignore_errors = True
[mypy-research.src.eligibility]
ignore_errors = True
[mypy-research.src.build_cfb_all_years]
ignore_errors = True
[mypy-research.src.build_aflw_all_years]
ignore_errors = True
[mypy-research.src.build_afl_all_years]
ignore_errors = True
[mypy-research.src.inspect_cricsheet_coverage]
ignore_errors = True
[mypy-research.src.fetch_all_eurobasket_data]
ignore_errors = True
[mypy-research.src.count_cricsheet_non_wc]
ignore_errors = True
[mypy-research.src.collect_cfb_postseason]
ignore_errors = True
[mypy-research.src.audit_all_odi_years]
ignore_errors = True
